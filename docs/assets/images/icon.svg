<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="DuplicateFileAssistant">
  <defs>
    <linearGradient id="bg" x1="72" y1="40" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="paper" x1="176" y1="140" x2="376" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- Back sheet: the duplicate -->
  <rect x="104" y="104" width="188" height="244" rx="26" fill="#FFFFFF" opacity="0.45"
        transform="rotate(-10 198 226)"/>

  <!-- Front sheet -->
  <rect x="180" y="136" width="192" height="250" rx="26" fill="url(#paper)"/>
  <rect x="214" y="206" width="112" height="18" rx="9" fill="#2563EB" opacity="0.85"/>
  <rect x="214" y="246" width="84" height="18" rx="9" fill="#2563EB" opacity="0.55"/>
  <rect x="214" y="286" width="120" height="18" rx="9" fill="#2563EB" opacity="0.35"/>

  <!-- Magnifier -->
  <circle cx="348" cy="348" r="60" fill="none" stroke="#FACC15" stroke-width="30"/>
  <circle cx="348" cy="348" r="60" fill="#0F766E" opacity="0.25"/>
  <line x1="392" y1="392" x2="440" y2="440" stroke="#FACC15" stroke-width="36" stroke-linecap="round"/>
</svg>
